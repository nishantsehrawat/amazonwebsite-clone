<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon.com</title>
    <link rel="stylesheet" href="css/stylesheet.css">

</head>
<body>
    <header>
        <!-- ===============================
    NAVBAR
    =============================== -->
        <nav class="navbar">

            <!-- TOP NAV     -->
            <div class="nav-top">
                <div class="nav-logo nav-border">
                    <!-- <div class="amazonlogo"></div> -->
                </div>
                <div class="nav-address nav-border">
                    <svg class="pinpoint" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-map-pin preview-icon">
                        <path
                            d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>

                    <div class="nav-address-location">
                        <span class="deliver-to">Deliver to</span>
                        <span class="india">India </span>
                    </div>
                </div>
                <div class="navsearchbox">
                    <div class="all-box"></div>
                    <div class="search-bar"></div>
                    <div class="search-button"></div>
                </div>
                <div class="nav-lang">
                    <div class="flag"></div>
                    <div class="lang"></div>
                    <div class="dropdown-icon"></div>
                </div>
                <div class="navsign-in">
                    <div class="sign-in"></div>
                    <div class="dropdown-icon"></div>

                </div>
                <div class="navreturn-orders">
                    <div class="retun-order"></div>
                </div>
                <div class="nav-cart">
                    <div class="cart-icon"></div>
                    <div class="cart"></div>
                </div>
            </div>

            <!-- BOTTOM NAV -->
            <div class="nav-bottom">
                <div class="nav-bottom_allbox"></div>
                <div class="nav-bottom_primevideo"></div>
                <div class="nav-bottom_coupons"></div>
                <div class="nav-bottom_sell"></div>
            </div>
        </nav>


    </header>
    <!-- ===============================
    MAIN CONTENT
    =============================== -->
    <main>

    </main>
</body>
</html>
