<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon.com</title>
    <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body>
    <header>
        <!-- ===============================
    NAVBAR
    =============================== -->
        <nav class="navbar">

            <!-- TOP NAV     -->
            <div class="nav-top">
                <div class="nav-logo">
                    <div class="amazonlogo"></div>
                </div>
                <div class="nav-address">
                    <div class="pinpoint"></div>
                    <div class="nav-address-location"></div>
                </div>
                <div class="navsearchbox">
                    <div class="all-box"></div>
                    <div class="search-bar"></div>
                    <div class="search-button"></div>
                </div>
                <div class="nav-lang">
                    <div class="flag"></div>
                    <div class="lang"></div>
                    <div class="dropdown-icon"></div>
                </div>
                <div class="navsign-in">
                    <div class="sign-in"></div>
                    <div class="dropdown-icon"></div>

                </div>
                <div class="navreturn-orders">
                    <div class="retun-order"></div>
                </div>
                <div class="nav-cart">
                    <div class="cart-icon"></div>
                    <div class="cart"></div>
                </div>
            </div>

            <!-- BOTTOM NAV -->
            <div class="nav-bottom">
                <div class="nav-bottom_allbox"></div>
                <div class="nav-bottom_primevideo"></div>
                <div class="nav-bottom_coupons"></div>
                <div class="nav-bottom_sell"></div>
            </div>
        </nav>


    </header>
    <!-- ===============================
    MAIN CONTENT
    =============================== -->
    <main>

    </main>
</body>
</html>
